# Lint, unit tests, and browser smoke tests on every push and pull request.
#
# master auto-deploys to Vercel, so until now 110 tests and a clean lint config
# gated nothing at all — a red suite shipped exactly as fast as a green one.
#
# The e2e job runs the real build and drives it in Chromium, which is the only
# thing that checks the four build scripts (route HTML, manifests, feeds,
# service worker) actually emitted what the site references.

name: CI

on:
  push:
    branches: [master]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

  e2e:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # playwright.config.js builds the site and starts `vite preview` itself.
      - run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
