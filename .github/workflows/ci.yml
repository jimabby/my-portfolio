# Lint, unit tests, and browser smoke tests on every push and pull request.
#
# master auto-deploys to Vercel, so until now 110 tests and a clean lint config
# gated nothing at all — a red suite shipped exactly as fast as a green one.
#
# The e2e job runs the real build and drives it in Chromium, which is the only
# thing that checks the four build scripts (route HTML, manifests, feeds,
# service worker) actually emitted what the site references.

name: CI

on:
  push:
    branches: [master]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

  e2e:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # public/responsive is gitignored, so without this every run re-encodes
      # all ~610 variants from scratch — 160s of CPU, most of it AVIF, which
      # is what pushed the build past the old webServer timeout. The generator
      # skips any output that already exists for that exact content, so a hit
      # turns the whole step into a no-op. restore-keys lets a near-miss
      # (one image edited) still reuse the rest; the fresh key is saved after.
      - uses: actions/cache@v4
        with:
          path: public/responsive
          key: responsive-${{ hashFiles('src/assets/**/*.webp', 'src/assets/**/*.jpg', 'src/assets/**/*.jpeg', 'src/assets/**/*.png', 'scripts/generate-responsive-images.mjs') }}
          restore-keys: responsive-

      # Built here rather than inside playwright.config.js's webServer command
      # so a build failure reports itself instead of becoming a mute timeout.
      - run: npm run build

      # playwright.config.js starts `vite preview` over the dist/ built above.
      - run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
